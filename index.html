<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurante JCID - Menú</title>
    
    <style>
        /* Esto estira el fondo para que ocupe toda la pantalla */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a; /* Un fondo gris oscuro muy elegante */
            color: white; /* Letras blancas para que se lean bien */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh; /* Hace que todo se centre verticalmente en la pantalla */
            text-align: center;
        }

        /* Estilo para el nombre de tu restaurante */
        h1 {
            font-size: 3.5rem; /* Letras grandes */
            margin-bottom: 10px;
            color: #ffcc00; /* Un toque de color dorado/amarillo para el nombre */
        }

        p {
            font-size: 1.2rem;
            color: #e0e0e0;
            margin-bottom: 30px;
        }

        /* Estilo para que el menú de navegación se vea como botones modernos */
        nav a {
            color: white;
            text-decoration: none; /* Quita la línea de abajo del enlace */
            background-color: #333;
            padding: 10px 20px;
            border-radius: 5px;
            margin: 0 10px;
            transition: 0.3s; /* Hace que el cambio de color sea suave */
        }

        /* Cuando el cliente pasa el mouse por encima de los botones */
        nav a:hover {
            background-color: #ffcc00;
            color: black;
        }
    </style>
</head>
<body>

    <h1>Restaurante JCID</h1>
    <p>Disfruta de la mejor experiencia gastronómica</p>

    <nav>
        <a href="entradas.html">Entradas</a>
        <a href="platos-principales.html">Platos Principales</a>
        <a href="postres.html">Postres</a>
    </nav>

</body>
</html>
